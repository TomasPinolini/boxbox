<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Montserrat es la tipografia GENERAL de toda la app (ver --font-sans en
         src/index.css) — pedido del usuario 2026-10-14: nacio en las driver cards (ahi
         "tenia que destacar" contra el resto del sitio), y un dia despues el pedido se dio
         vuelta — generalizarla a todo el programa. Saira Condensed sigue aparte, solo para
         numeros (ver --font-display): esa regla no cambio, numeros en standings/stats/
         dorsales siguen con la condensada tipo timing-screen.
         Pesos 400/500/600/700/800: son los cinco que usa el proyecto (font-normal a
         font-extrabold, ver clases en los componentes) — con menos, un peso sin archivo
         propio cae al bold sintetico del navegador, que se nota.
         preconnect a los DOS dominios: googleapis.com sirve el CSS, gstatic.com los .woff2.
         Sin el segundo, el navegador recien descubre gstatic al parsear el CSS y paga un
         handshake TLS entero de mas. crossorigin es obligatorio en el de las fuentes.
         display=swap: el texto se dibuja ya con la fuente del sistema y cambia cuando
         llega la otra. Si no hay red, se queda en la del sistema y la app se ve como antes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Saira+Condensed:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fantasy League de Fórmula 1: armá tu equipo en un draft en vivo y competí con resultados reales de la temporada."
    />
    <!-- Color de la barra de estado del navegador, uno por tema — tiene que igualar el color
         de ARRIBA de la pagina en cada uno (bg-slate-50 / dark:bg-ink en app/App.tsx), no el
         color de marca. El navegador elige con el mismo prefers-color-scheme que ya usa
         Tailwind para el variant dark:. -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1c" media="(prefers-color-scheme: dark)" />
    <!-- Antes era solo "light" (el modo oscuro no existia). Ahora que el rollout cubre toda
         la app (2026-10-14), declarar los dos le pide al navegador sus controles nativos
         (scrollbar, el popup de un <select> — ver dark:[color-scheme:dark] en Field.tsx, que
         ya no hace falta ahi pero no molesta dejarlo) en el tema que corresponda. -->
    <meta name="color-scheme" content="light dark" />
    <title>BoxBox — Fantasy League de F1</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
